services:
  planner-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-54398}:54398"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${DB_USER:-planner}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-planner}
      - POSTGRES_DB=${DB_NAME:-planner}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: